name: Build WebtoApp

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source security policy
        run: python3 scripts/verify_source.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build WebtoApp APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify merged permissions
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk > builder-permissions.txt
          "$AAPT2" dump permissions shell/build/outputs/apk/release/shell-release-unsigned.apk > shell-permissions.txt

          for permission in INTERNET ACCESS_NETWORK_STATE ACCESS_WIFI_STATE READ_PHONE_STATE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION READ_CONTACTS READ_SMS REQUEST_INSTALL_PACKAGES; do
            if grep -q "android.permission.$permission" builder-permissions.txt; then
              echo "Forbidden builder permission: $permission"
              cat builder-permissions.txt
              exit 1
            fi
          done

          grep -q "android.permission.INTERNET" shell-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" shell-permissions.txt
          for permission in ACCESS_WIFI_STATE READ_PHONE_STATE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION READ_CONTACTS READ_SMS REQUEST_INSTALL_PACKAGES; do
            if grep -q "android.permission.$permission" shell-permissions.txt; then
              echo "Forbidden shell permission: $permission"
              cat shell-permissions.txt
              exit 1
            fi
          done

      - name: Prepare WebtoApp APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WebtoApp.apk

      - name: Upload WebtoApp APK
        uses: actions/upload-artifact@v4
        with:
          name: WebtoApp
          path: WebtoApp.apk
          if-no-files-found: error
